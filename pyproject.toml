[project]
name = "jevstral"
version = "0.1.0"
description = "A decision model on Ministral 3 8B, trained with the Kev method"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["modal>=1.6,<2"]

[dependency-groups]
# Installed only in the Modal image (modal_app.py), not on the local computer.
train = ["torch==2.14.1", "transformers==5.18.0", "peft==0.21.2", "wandb>=0.22"]
# The Decision Index harness, pinned to one commit. Installed only in the Modal image.
bench = ["decision-index[rebuild] @ git+https://github.com/apolinario/decision-index@87d4650b42b377c0291a89c1f1a879f9b31082bf"]
dev = ["ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevstral"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
