<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<div class="fig" style="height: 520px">
  <h1>What stage 4 adds</h1>
  <p class="sub">Accuracy on development splits after stage 2 and after stage 4 (the final model).</p>
  <div class="legend" style="margin: 0 0 14px">
    <span><i class="sw" style="background: var(--blue); border-radius: 7px"></i>After stage 2</span>
    <span><i class="sw" style="background: var(--clay); border-radius: 7px"></i>After stage 4</span>
  </div>
  <svg id="chart"></svg>
  <p class="foot">Stage 4 trains long policies with exceptions, trade-offs, multi-hop reasoning, judging and developer-tool decisions.</p>
</div>
<script>
const rows = [
  ["decision-v7 · classification", 0.884, 0.881],
  ["documents-v1 · complaints", 0.851, 0.891],
  ["hard-v1 · reasoning skills", 0.517, 0.810],
  ["devtools-v1 · developer tools", 0.563, 0.710],
];
const svg = document.getElementById("chart");
const W = 1088, left = 290, right = 90, y0 = 10, rowH = 56, lo = 0.4, hi = 1.0;  // not "top": window.top is read-only
const H = y0 + rows.length * rowH + 34, x = v => left + (W - left - right) * (v - lo) / (hi - lo);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
let s = "";
for (let t = 0.4; t <= 1.0001; t += 0.1) {
  s += `<line class="c-grid" x1="${x(t)}" y1="${y0}" x2="${x(t)}" y2="${y0 + rows.length * rowH}"/>`;
  s += `<text class="c-axis" x="${x(t)}" y="${y0 + rows.length * rowH + 24}" text-anchor="middle">${t.toFixed(1)}</text>`;
}
rows.forEach(([label, before, after], i) => {
  const y = y0 + i * rowH + rowH / 2;
  s += `<text class="c-label" x="${left - 18}" y="${y + 5}" text-anchor="end">${label}</text>`;
  s += `<line x1="${x(before)}" y1="${y}" x2="${x(after)}" y2="${y}" stroke="#cfccc1" stroke-width="3"/>`;
  s += `<circle cx="${x(before)}" cy="${y}" r="8" fill="var(--blue)" stroke="var(--ivory)" stroke-width="2"/>`;
  s += `<circle cx="${x(after)}" cy="${y}" r="9" fill="var(--clay)" stroke="var(--ivory)" stroke-width="2"/>`;
  const gain = after - before;
  const tx = Math.max(x(after), x(before)) + 18;
  s += `<text class="c-value" x="${tx}" y="${y + 5}" font-weight="600">${after.toFixed(3)}</text>`;
  if (Math.abs(gain) >= 0.01) s += `<text class="c-note" x="${tx + 52}" y="${y + 5}">${gain > 0 ? "+" : ""}${(gain * 100).toFixed(1)}</text>`;
});
svg.innerHTML = s;
</script>
